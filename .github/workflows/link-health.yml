name: Weekly Link Check

on:
  schedule:
    # Every Thursday at 09:00 UTC
    - cron: "0 9 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN is enough to push when contents: write.
          # Commits are attributed as MOHAbdelkarim (never github-actions[bot]).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check and repair links
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_URL: https://github.com/mohabdelkarim/awesome-ai-resources
        run: python scripts/check_and_repair_links.py

      - name: Commit repairs as repository owner
        env:
          GIT_AUTHOR_NAME: MOHAbdelkarim
          GIT_AUTHOR_EMAIL: mohaabdelkarim2@gmail.com
          GIT_COMMITTER_NAME: MOHAbdelkarim
          GIT_COMMITTER_EMAIL: mohaabdelkarim2@gmail.com
        run: |
          set -euo pipefail

          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          repaired=$(grep -c 'Status: `repaired`' link-health-report.md 2>/dev/null || true)
          unresolved=$(grep -c 'Status: `unresolved`' link-health-report.md 2>/dev/null || true)
          repaired=${repaired:-0}
          unresolved=${unresolved:-0}

          git add README.md link-health-report.md
          git commit -m "$(cat <<EOF
          fix: repair ${repaired} dead links (weekly link check)

          Unresolved: ${unresolved}. See link-health-report.md.
          EOF
          )"

          git push

      - name: Slack weekly summary
        if: success()
        env:
          SLACK_WEBHOOK_CONTENT: ${{ secrets.SLACK_WEBHOOK_CONTENT }}
        run: |
          if [ -z "$SLACK_WEBHOOK_CONTENT" ]; then exit 0; fi
          repaired=$(grep -c 'Status: `repaired`' link-health-report.md 2>/dev/null || echo 0)
          unresolved=$(grep -c 'Status: `unresolved`' link-health-report.md 2>/dev/null || echo 0)
          python scripts/slack_notify.py --digest \
            --title "awesome-ai-resources link check" \
            --text "Repaired: ${repaired}\nUnresolved: ${unresolved}\nReport: link-health-report.md" \
            --webhook-env SLACK_WEBHOOK_CONTENT

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
