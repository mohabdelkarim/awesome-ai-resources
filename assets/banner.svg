<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Awesome AI Resources">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1412"/>
      <stop offset="100%" stop-color="#11201b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dffb3"/>
      <stop offset="55%" stop-color="#3dd6c6"/>
      <stop offset="100%" stop-color="#f0c75e"/>
    </linearGradient>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #f4fff8; text-anchor: middle; }
      .body { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #b8d5ca; text-anchor: middle; }
      .chip { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #d8efe5; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="19" fill="none" stroke="#29423a"/>
  <text x="600" y="94" class="title">Awesome AI Resources</text>
  <text x="600" y="126" class="body">A roadmap first collection of high-signal AI courses, books, tools, papers, labs, and communities.</text>
  <rect x="240" y="148" width="720" height="3" rx="2" fill="#1d342d"/>
  <rect x="410" y="148" width="380" height="3" rx="2" fill="url(#accent)"/>

  <rect x="188" y="170" width="118" height="28" rx="14" fill="#132923"/>
  <text x="247" y="188" class="chip">Foundations</text>

  <rect x="320" y="170" width="152" height="28" rx="14" fill="#132923"/>
  <text x="396" y="188" class="chip">Machine Learning</text>

  <rect x="486" y="170" width="134" height="28" rx="14" fill="#132923"/>
  <text x="553" y="188" class="chip">Deep Learning</text>

  <rect x="634" y="170" width="126" height="28" rx="14" fill="#132923"/>
  <text x="697" y="188" class="chip">NLP &amp; LLMs</text>

  <rect x="774" y="170" width="136" height="28" rx="14" fill="#132923"/>
  <text x="842" y="188" class="chip">Agents &amp; RAG</text>
</svg>
